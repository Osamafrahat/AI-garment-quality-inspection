[project]
name = "garment-inspection-api"
version = "0.1.0"
description = "FastAPI service for AI garment quality inspection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything needed for real inference + training. Kept in sync with
# requirements-ml.txt — torch only, no OpenCV (annotations are drawn with PIL).
vision = [
    "torch>=2.4",
    "torchvision>=0.19",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
